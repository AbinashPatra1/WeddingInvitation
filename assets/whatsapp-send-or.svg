<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" role="img" aria-label="ଆପଣଙ୍କ ଉତ୍ତର ଲେଖାଥିବା ହ୍ୱାଟସଆପ୍ ଚ୍ୟାଟ୍। ତଳ ଡାହାଣରେ ଥିବା ସବୁଜ ତୀର ଦାବନ୍ତୁ।">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="#d5cbbb" opacity=".6"/><circle cx="12" cy="12" r="1.2" fill="#d5cbbb" opacity=".6"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity=".18"/></filter>
  </defs>
  <rect width="360" height="210" rx="16" fill="#efe7dd"/>
  <rect width="360" height="210" rx="16" fill="url(#dots)"/>
  <!-- header -->
  <rect width="360" height="38" rx="16" fill="#008069"/><rect y="20" width="360" height="18" fill="#008069"/>
  <circle cx="26" cy="19" r="11" fill="#cfe9e4"/>
  <rect x="44" y="12" width="90" height="8" rx="4" fill="#fff"/><rect x="44" y="24" width="52" height="5" rx="2.5" fill="#bfe3db"/>
  <!-- the pre-filled message waiting in the box -->
  <g filter="url(#sh)">
    <rect x="12" y="136" width="290" height="52" rx="26" fill="#fff"/>
  </g>
  <rect x="34" y="148" width="200" height="7" rx="3.5" fill="#b9c0c4"/>
  <rect x="34" y="161" width="236" height="7" rx="3.5" fill="#b9c0c4"/>
  <rect x="34" y="174" width="150" height="7" rx="3.5" fill="#b9c0c4"/>
  <!-- send button -->
  <circle cx="326" cy="162" r="27" fill="none" stroke="#e5484d" stroke-width="3" opacity=".9"><animate attributeName="r" values="27;33;27" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;.2;.9" dur="1.4s" repeatCount="indefinite"/></circle>
  <circle cx="326" cy="162" r="23" fill="#00a884" filter="url(#sh)"/>
  <path d="M317 153 L338 162 L317 171 L320 163.5 L329 162 L320 160.5 Z" fill="#fff"/>
  <!-- callout -->
  <g>
    <rect x="172" y="70" width="176" height="40" rx="20" fill="#e5484d"/>
    <text x="260" y="96" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fff">ଏହି ସବୁଜ ବଟନ୍ ଦାବନ୍ତୁ</text>
    <path d="M326 110 V128" stroke="#e5484d" stroke-width="4" stroke-linecap="round"/>
    <path d="M318 122 L326 134 L334 122" fill="none" stroke="#e5484d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
